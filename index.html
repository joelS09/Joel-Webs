<style>
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
/* ===== Variables de estilo (las controla el editor: admin.html → "Colores del sitio") ===== */
:root{--acc:#fff;--bd:#fff;--btn:#fff;--btn-t:#000;--ledc:#fff,#fff;--ledt:4s;
--edge:color-mix(in srgb,var(--bd) 20%,transparent);--edge2:color-mix(in srgb,var(--bd) 38%,transparent);
--glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.015) 40%,rgba(0,0,0,.22)),rgba(14,14,16,.78);
--ins:inset 0 1px 0 rgba(255,255,255,.13)}
body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{position:fixed;top:0;left:0;right:0;width:100%;height:calc(54px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0 12px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(10,10,12,.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--edge)}
.logo-btn{flex:0 0 36px;width:36px;height:36px;border-radius:12px;border:1px solid var(--edge2);padding:0;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--acc);font-weight:900;font-size:15px;background:var(--glass);box-shadow:var(--ins);-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.34,1.5,.5,1),box-shadow .3s,border-color .3s}
.logo-btn:active{transform:scale(.9)}
.logo-btn img{width:100%;height:100%;object-fit:cover;display:block}
body.menu-open .logo-btn{border-color:var(--acc);box-shadow:var(--ins),0 0 14px color-mix(in srgb,var(--acc) 50%,transparent)}
.pill{flex-shrink:0;margin-left:auto;background:var(--btn);color:var(--btn-t);padding:10px 16px;border-radius:99px;font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.hero{position:relative;z-index:0;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px 40px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.5));z-index:-1}
.hero h1{font-size:clamp(32px,8vw,72px);font-weight:800;letter-spacing:-2px;line-height:.95;max-width:700px;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero p{opacity:.92;max-width:520px;margin:14px 0 22px;font-size:14px;text-shadow:0 1px 12px #000}
/* Superficies con el mismo estilo (cristal oscuro) */
.search,.tag,.card,.model-card,.bg-card,.pregunta-card{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--ins),0 10px 30px rgba(0,0,0,.45);border:1px solid var(--edge2)}
.search{border-radius:99px;padding:12px 16px;display:flex;align-items:center;gap:12px;width:100%;max-width:480px;margin-top:18px;transition:border-color .3s,box-shadow .3s}
.search:focus-within{border-color:var(--acc);box-shadow:var(--ins),0 0 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.search input{background:transparent;border:0;color:#fff;flex:1;outline:none;font-size:14px}
.clear-btn{width:22px;height:22px;border-radius:50%;background:var(--btn);color:var(--btn-t);border:0;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:900;cursor:pointer}
.search.has-text .clear-btn{display:flex}
.tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.tag{border-radius:99px;padding:6px 12px;font-size:11px;cursor:pointer;box-shadow:var(--ins),0 6px 16px rgba(0,0,0,.4)}
.tag::first-letter{color:var(--acc)}
.section{padding:32px 0 10px 16px;max-width:1280px;margin:0 auto;scroll-margin-top:70px}
.sec-head{margin-bottom:12px;padding-right:16px;display:flex;justify-content:space-between}
.sec-head h2{font-size:19px;font-weight:700}.sec-head h2:before{content:"✦ ";color:var(--acc)}
.carousel{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 26px 14px;margin-left:-14px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card,.model-card{flex:0 0 78vw;max-width:300px;border-radius:16px;display:flex;flex-direction:column}
.nores{opacity:.6;padding:20px 0;font-size:14px}
.pic{display:block;width:100%;height:auto;flex:1 0 auto;object-fit:cover;border-radius:16px 16px 0 0}
.pic.empty{height:170px;background:#000}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.led{position:relative}
.led::before,.led::after{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:conic-gradient(from var(--a),var(--ledc,#fff,#fff));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.led::after{filter:blur(7px);padding:4px;opacity:.9}
.led-rgb .led::before,.led-rgb .led::after{animation:spin var(--ledt) linear infinite}
.card,.model-card,.bg-card{border-color:transparent;background-color:rgba(12,12,14,.82)}
.card .pic,.model-card .pic,.bg-card .pic{margin:-1px -1px 0;width:calc(100% + 2px)}
.card-info{padding:12px 14px 6px;display:flex;justify-content:space-between;font-size:12px}
.card-info span{font-weight:700}
.card-desc{padding:0 14px 12px;opacity:.6;font-size:11.5px;line-height:1.5;min-height:54px;white-space:pre-line}
.card button,.model-card button{margin:auto 12px 12px;background:var(--btn);color:var(--btn-t);border:0;padding:9px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer}
.bg-card{flex:0 0 78vw;max-width:320px;border-radius:16px;display:flex;flex-direction:column}
.bg-card .pic{border-radius:16px 16px 0 0}
.bg-card .pic.empty{height:200px}
.bg-card .label{padding:12px 14px;font-size:16px;font-weight:700}
.bg-card .label small{display:block;font-size:11px;opacity:.7}
.preguntas-grid{display:flex;flex-direction:column;gap:12px;padding-right:16px;padding-bottom:20px}
.pregunta-card{border-radius:18px;padding:0 20px;overflow:hidden}
.pregunta-card h3{font-size:16px;font-weight:700;padding:20px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pregunta-card h3::after{content:"▼";font-size:18px;transform:scaleX(1.4);color:var(--acc)}
.pregunta-card.open h3::after{transform:scaleX(1.4) rotate(180deg)}
.pregunta-card p{font-size:14px;line-height:1.5;max-height:0;overflow:hidden;opacity:0;transition:.4s}
.pregunta-card.open p{max-height:300px;opacity:.7;margin-bottom:20px}
.cta{border-top:1px solid var(--edge);padding:44px 20px;text-align:center}
.cta h2{white-space:pre-line}
#btnCotizar{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:99px;background:var(--btn);color:var(--btn-t);font-weight:700;text-decoration:none}
.footer{padding:22px 16px 40px;text-align:center;font-size:12px;line-height:1.8;opacity:.75;border-top:1px solid var(--edge);text-shadow:0 1px 8px #000}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;z-index:120}
#pre{position:fixed;inset:0;z-index:400;background:#000;display:grid;place-items:center;transition:.8s}
#pre.out{opacity:0;visibility:hidden}
#pre .pre-logo{width:90px;height:90px;object-fit:contain;margin:0 auto 14px;display:block}
#pre .pt{font-size:clamp(2.4rem,9vw,4.4rem);font-weight:700;text-align:center}
#pre .pl2{display:flex;align-items:center;gap:14px;margin:18px auto 0;width:min(260px,70vw)}
#pre .pb{flex:1;height:1px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
#pre .pb:after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(var(--p,0));transform-origin:left}
#pre small{font-size:.7rem;letter-spacing:.2em;min-width:34px;text-align:right}

/* ===== Panel del menú (se abre al tocar el logo) ===== */
.sm-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.sm{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(300px,84vw);z-index:310;display:flex;flex-direction:column;padding:16px 14px 14px;border-radius:28px;background:linear-gradient(180deg,rgba(34,34,38,.97),rgba(12,12,14,.98));-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--edge2);box-shadow:var(--ins),0 24px 60px rgba(0,0,0,.65);transform:translateX(calc(-100% - 24px));transition:transform .5s cubic-bezier(.22,1,.36,1);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sm::-webkit-scrollbar{display:none}
body.menu-open .sm{transform:none}
body.menu-open .sm-ov{opacity:1;visibility:visible}
body.menu-open{overflow:hidden}
.sm-head{display:flex;align-items:center;gap:12px;padding:2px 8px}
.sm-head img,.sm-head .sm-l{flex:0 0 32px;width:32px;height:32px;border-radius:10px;object-fit:cover;display:grid;place-items:center;font-weight:900;color:var(--acc);background:rgba(255,255,255,.08)}
.sm-head b{font-size:15px;font-weight:700;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-hr{height:1px;margin:12px 6px;background:linear-gradient(90deg,transparent,var(--edge2),transparent);flex:0 0 1px}
.sm-item{position:relative;display:flex;align-items:center;gap:14px;padding:13px 16px;margin:3px 0;border-radius:99px;border:1px solid transparent;color:rgba(255,255,255,.72);font-size:15px;font-weight:600;text-decoration:none;background:none;width:100%;text-align:left;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateX(-14px);transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
body.menu-open .sm-item{opacity:1;transform:none;transition:background .25s,color .25s,border-color .25s,box-shadow .25s,opacity .4s ease calc(var(--i)*50ms + 120ms),transform .5s cubic-bezier(.22,1,.36,1) calc(var(--i)*50ms + 120ms)}
.sm-item svg{flex:0 0 22px;width:22px;height:22px}
.sm-item:hover,.sm-item:active{color:#fff;background:rgba(255,255,255,.06)}
.sm-item.on{color:#fff;border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 7%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 22px color-mix(in srgb,var(--acc) 28%,transparent)}
.sm-item.on::before{content:"";position:absolute;left:-10px;top:50%;width:3px;height:18px;margin-top:-9px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.sm-badge{margin-left:auto;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--edge2);color:#fff}
.sm-sp{flex:1;min-height:12px}
.sm-item.sm-cta{background:var(--btn);color:var(--btn-t);justify-content:center;font-weight:800;margin-top:6px}
.sm-item.sm-close{color:rgba(255,255,255,.5);font-weight:500}
</style>
</head>
<body>
<div id="pre"><div><img id="preLogo" class="pre-logo" alt=""><div class="pt" id="preName"></div><div class="pl2"><span class="pb"></span><small id="pn">0%</small></div></div></div>
<div id="prog"></div>
<video class="bgv" id="videoFondo" autoplay muted loop playsinline preload="auto"></video>
<nav><div class="brand"><button class="logo-btn" id="logoBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sideMenu"></button><span class="logo" id="logo"></span></div><a href="#cotizar" class="pill" id="pill"></a></nav>
<div class="sm-ov" id="smOv"></div>
<aside class="sm" id="sideMenu" aria-label="Menú" aria-hidden="true"></aside>
<main id="app"></main>
<footer class="footer" id="footer"></footer>

<script src="content/data.js"></script>
<script>
/* El contenido vive en content/data.js — edítalo desde admin.html */
const D=(()=>{try{if(/preview/.test(location.search)){const d=localStorage.getItem('joelwebs_draft');if(d)return JSON.parse(d)}}catch(e){}return window.SITE_DATA})();
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pic=o=>o.img?`<img class="pic" src="${E(encodeURI(o.img))}" alt="">`:'<div class="pic empty"></div>';
const fixImgs=()=>document.querySelectorAll('img.pic').forEach(im=>{im.onerror=()=>im.replaceWith(Object.assign(document.createElement('div'),{className:'pic empty'}))});
const fill=(t,n,p)=>String(t).replace('{n}',n).replace('{p}',p);
const M=D.marca,C=D.contacto,S=D.secciones;
const ST=Object.assign({ledModo:'fijo',ledColor:'#ffffff',generalModo:'fijo',generalColor:'#ffffff',botonModo:'fijo',botonColor:'#ffffff',rgbColores:['#ff0055','#00ff88','#0055ff'],ledVelocidad:'4'},D.estilo||{});
/* Colores: general (acentos), márgenes (contornos) y botones; cada uno fijo o RGB */
(()=>{const cols=(ST.rgbColores||[]).filter(Boolean),rgbOk=cols.length>1,on=m=>m==='rgb'&&rgbOk,sp=parseFloat(ST.ledVelocidad)||4,r=document.documentElement.style;
const lum=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(h).trim());if(!m)return 1;const n=parseInt(m[1],16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const txt=h=>lum(h)>.36?'#000':'#fff';
if(on(ST.ledModo)){r.setProperty('--ledc',[...cols,cols[0]].join(','));document.body.classList.add('led-rgb')}else r.setProperty('--ledc',ST.ledColor+','+ST.ledColor);
r.setProperty('--ledt',sp+'s');
r.setProperty('--acc',on(ST.generalModo)?'var(--rgb)':ST.generalColor);
r.setProperty('--bd',on(ST.ledModo)?'var(--rgb)':ST.ledColor);
r.setProperty('--btn',on(ST.botonModo)?'var(--rgb)':ST.botonColor);
r.setProperty('--btn-t',on(ST.botonModo)?(cols.reduce((a,c)=>a+lum(c),0)/cols.length>.36?'#000':'#fff'):txt(ST.botonColor));
if([ST.generalModo,ST.ledModo,ST.botonModo].some(on)){
  const k=[...cols,cols[0]],s=document.createElement('style');
  s.textContent=`@property --rgb{syntax:'<color>';inherits:true;initial-value:${cols[0]}}@keyframes rgbc{${k.map((c,i)=>`${(i/(k.length-1)*100).toFixed(2)}%{--rgb:${c}}`).join('')}}:root{animation:rgbc ${sp*2}s linear infinite}`;
  document.head.appendChild(s);
}})();
const wa=m=>`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(m)}`;

$('logo').textContent=M.nombre;$('preName').textContent=M.nombre;
$('preLogo').src=M.logo;$('preLogo').onerror=function(){this.onerror=null;this.src=M.logo.replace(/\.jpg$/,'.png')};
const ICONS={inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',planes:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',modelos:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',portafolio:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/>',preguntas:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.8.6-1.5 1-1.5 2M12 17h.01"/>',_:'<circle cx="12" cy="12" r="3"/>'};
const svg=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||ICONS._}</svg>`;
$('pill').textContent=D.boton.texto;
$('footer').innerHTML=D.footer.map(l=>`<div>${E(l)}</div>`).join('');

/* Menú: el logo (a la izquierda del nombre) abre el panel */
const lg=E(encodeURI(M.logo));
$('logoBtn').innerHTML=`<img src="${lg}" alt="">`;
$('logoBtn').firstChild.onerror=function(){$('logoBtn').textContent=M.nombre.charAt(0)};
$('sideMenu').innerHTML=`<div class="sm-head"><img src="${lg}" alt=""><b>${E(M.nombre)}</b></div><div class="sm-hr"></div>`
 +D.menu.map((m,i)=>(i===2||i===4?'<div class="sm-hr"></div>':'')+`<a class="sm-item" style="--i:${i}" href="#${E(m.id)}" data-id="${E(m.id)}">${svg(m.id)}<span>${E(m.texto)}</span>${m.id==='modelos'?`<span class="sm-badge" id="badgeModelos">${D.modelos.length}</span>`:''}</a>`).join('')
 +`<div class="sm-sp"></div><div class="sm-hr"></div><a class="sm-item sm-cta" style="--i:${D.menu.length}" href="#cotizar">${E(D.boton.texto)}</a>`
 +`<button class="sm-item sm-close" style="--i:${D.menu.length+1}" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg><span>Cerrar</span></button>`;
$('sideMenu').querySelector('.sm-head img').onerror=function(){this.replaceWith(Object.assign(document.createElement('span'),{className:'sm-l',textContent:M.nombre.charAt(0)}))};
const setMenu=o=>{document.body.classList.toggle('menu-open',o);$('logoBtn').setAttribute('aria-expanded',o);$('sideMenu').setAttribute('aria-hidden',!o)};
$('logoBtn').onclick=()=>setMenu(!document.body.classList.contains('menu-open'));
$('smOv').onclick=()=>setMenu(false);
$('sideMenu').addEventListener('click',e=>{if(e.target.closest('a.sm-item,button.sm-close'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});

$('app').innerHTML=`
<div class="hero" id="inicio"><h1>${E(D.hero.titulo)}</h1><p>${E(D.hero.texto)}</p>
<div class="search" id="searchBox"><input id="buscador" placeholder="${E(D.hero.placeholder)}" autocomplete="off"><button class="clear-btn" id="clearBtn">✕</button></div>
<div class="tags" id="tagsContainer"></div></div>
<div class="section" id="planes"><div class="sec-head"><h2>${E(S.planes)}</h2></div><div class="carousel" id="carouselPlanes"></div></div>
<div class="section" id="modelos"><div class="sec-head"><h2>${E(S.modelos)}</h2><span id="contador"></span></div><div class="carousel" id="carouselModelos"></div></div>
<div class="section" id="portafolio"><div class="sec-head"><h2>${E(S.portafolio)}</h2></div><div class="carousel" id="carouselPorta"></div></div>
<div class="section" id="preguntas"><div class="sec-head"><h2>${E(S.preguntas)}</h2></div><div class="preguntas-grid">${D.preguntas.map(q=>`<div class="pregunta-card"><h3>${E(q.q)}</h3><p>${E(q.a)}</p></div>`).join('')}</div></div>
<div class="cta" id="cotizar"><h2 id="tituloCotizar">${E(C.titulo)}</h2><a id="btnCotizar" href="${wa(C.msgGeneral)}">${E(C.boton)}</a></div>`;

$('inicio').prepend($('videoFondo'));fixImgs();
/* Buscador: filtra planes, modelos y portafolio; sugerencias automáticas */
const buscador=$('buscador'),contador=$('contador'),searchBox=$('searchBox'),clearBtn=$('clearBtn'),tagsContainer=$('tagsContainer');
const mezclar=a=>[...a].sort(()=>0.5-Math.random());
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const words=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const cPlan=(p,i)=>`<div class="card led">${pic(p)}<div class="card-info"><b>${E(p.nombre)}</b><span>${E(p.precio)}</span></div><div class="card-desc">${E(p.desc)}</div><button data-plan="${i}">Seleccionar plan</button></div>`;
const cMod=(m,i)=>`<div class="model-card led">${pic(m)}<div class="card-info"><b>${E(m.titulo)}</b><span>${E(m.precio)}</span></div><button data-mod="${i}">Seleccionar modelo</button></div>`;
const cPor=p=>`<div class="bg-card led">${pic(p)}<div class="label">${E(p.nombre)} <small>${E(p.plan)}</small></div></div>`;
function pintar(q,exacto){
  const nq=norm(q).trim(),todo=!nq||nq==='todos';
  const ok=o=>todo||(exacto?words([o.nombre,o.titulo,o.plan,o.keys].join(' ')).includes(nq):norm([o.nombre,o.titulo,o.plan,o.keys,o.precio].join(' ')).includes(nq));
  const fill=(id,arr,fn,msg)=>{const h=arr.map((o,i)=>ok(o)?fn(o,i):'').join('');$(id).innerHTML=h||`<p class="nores">${msg}</p>`;return arr.filter(ok).length};
  fill('carouselPlanes',D.planes,cPlan,'No hay planes con esa palabra clave.');
  contador.textContent=fill('carouselModelos',D.modelos,cMod,'No hay modelos con esa palabra clave.')+' modelos';
  fill('carouselPorta',D.portafolio,cPor,'No hay trabajos con esa palabra clave.');
  fixImgs();
}
/* Cada plan, modelo y trabajo del portafolio aporta palabras clave automáticamente */
const STOP=new Set('de del la el los las y e o con para en un una al por que plan planes modelo modelos web sitio pagina'.split(' '));
function pool(){
  const m=new Map(),add=t=>String(t||'').split(/[^\p{L}\p{N}]+/u).forEach(w=>{const n=norm(w);if(w.length<3||STOP.has(n)||/\d/.test(n)||m.has(n))return;m.set(n,w.charAt(0).toUpperCase()+w.slice(1))});
  D.planes.forEach(p=>add(p.nombre+' '+(p.keys||'')));
  D.modelos.forEach(x=>add(x.titulo+' '+(x.keys||'')));
  D.portafolio.forEach(x=>add(x.nombre+' '+x.plan+' '+(x.keys||'')));
  return [...m.values()];
}
function generarTags(){
  tagsContainer.innerHTML='';
  ['Todos',...mezclar(pool()).slice(0,4)].forEach(p=>{
    const s=document.createElement('span');s.className='tag';s.textContent='✦ '+p;
    s.onclick=()=>{const w=p==='Todos'?'':p;buscador.value=w;searchBox.classList.toggle('has-text',!!w);pintar(w,true);if(w)$('modelos').scrollIntoView({behavior:'smooth'})};
    tagsContainer.appendChild(s);
  });
}
generarTags();pintar('');
buscador.addEventListener('input',()=>{const q=buscador.value.trim();searchBox.classList.toggle('has-text',!!q);if(!q)generarTags();pintar(q,false)});
clearBtn.addEventListener('click',()=>{buscador.value='';searchBox.classList.remove('has-text');pintar('');generarTags()});

/* Selección → WhatsApp */
function elegir(titulo,msg,n,p){const u=wa(fill(msg,n,p));$('tituloCotizar').textContent=fill(titulo,n,p);$('btnCotizar').href=u;$('cotizar').scrollIntoView({behavior:'smooth'});setTimeout(()=>window.open(u,'_blank'),600)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-plan],button[data-mod]');
  if(b){if(b.dataset.plan!=null){const p=D.planes[b.dataset.plan];elegir(C.tituloPlan,C.msgPlan,p.nombre,p.precio)}else{const m=D.modelos[b.dataset.mod];elegir(C.tituloModelo,C.msgModelo,m.titulo,m.precio)}return}
  const q=e.target.closest('.pregunta-card');if(q)q.classList.toggle('open');
});

/* Progreso y sección activa del menú */
const pg=$('prog');
const secs=D.menu.map(m=>$(m.id)).filter(Boolean);
const tabEls=[...document.querySelectorAll('.sm-item[data-id]')];let act=null;
function setActive(id){if(!id||id===act)return;act=id;tabEls.forEach(t=>t.classList.toggle('on',t.dataset.id===id))}
function onScroll(){
  const y=scrollY,mx=document.documentElement.scrollHeight-innerHeight;
  pg.style.transform='scaleX('+(mx>0?y/mx:0)+')';
  let cur=secs[0]&&secs[0].id;secs.forEach(s=>{if(y+200>=s.offsetTop)cur=s.id});
  setActive(cur);
}
addEventListener('scroll',onScroll,{passive:true});onScroll();

/* Precarga */
const pre=$('pre'),pn=$('pn');
function done(){pre.classList.add('out');setTimeout(()=>pre.remove(),800)}
const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,2);pre.style.setProperty('--p',e);pn.textContent=Math.round(e*100)+'%';if(k<1)requestAnimationFrame(f);else setTimeout(done,200)})(t0);setTimeout(done,2500);

/* Video de fondo (continúa en el mismo segundo al volver) */
const v=$('videoFondo');v.muted=true;v.loop=true;v.playsInline=true;v.src=M.video;
const guardar=()=>{try{if(v.currentTime>0.5)sessionStorage.setItem('joel_video_segundo',v.currentTime)}catch(e){}};
function iniciar(){const g=parseFloat(sessionStorage.getItem('joel_video_segundo')||0);try{if(g>0.5&&v.duration&&g<v.duration-0.5)v.currentTime=g}catch(e){}const p=v.play();if(p)p.catch(()=>{})}
v.addEventListener('loadedmetadata',iniciar);
v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime>v.duration-0.25){v.currentTime=0;v.play().catch(()=>{})}guardar()});
v.addEventListener('pause',()=>{if(!document.hidden)v.play().catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)iniciar()});
['pageshow','focus'].forEach(e=>addEventListener(e,iniciar));['pagehide','blur'].forEach(e=>addEventListener(e,guardar));
setInterval(guardar,800);
</script>
</body>
</html>
