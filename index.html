if(ST.tema==='personalizado'){const a=hex(ST.temaAcento),b=hex(ST.temaAcento2),f=hex(ST.temaFondo);if(a&&b&&f)T={bg:ST.temaFondo,acc:ST.temaAcento,acc2:ST.temaAcento2,amb:[ST.temaAcento,ST.temaAcento2,hx(a.map((v,i)=>Math.round((v+b[i])/2)))],t:1}}

T.amb.forEach((c,i)=>r.setProperty('--amb'+(i+1),j(hex(c))));r.setProperty('--g1',j(hex(g[0])));r.setProperty('--g2',j(hex(g[1])));
if(T.t){r.setProperty('--cardb','rgba('+j(A)+',.4)');r.setProperty('--cardbg','rgba('+j(A)+',.14)');r.setProperty('--chk','rgba('+j(A)+',.45)')}

/* Buscador: filtra planes, modelos y portafolio. Predicciones tipo YouTube y tarjetas de sugerencia: todo se genera solo desde los datos (admin) */
const buscador=$('buscador'),contador=$('contador'),searchBox=$('searchBox'),clearBtn=$('clearBtn'),tagsContainer=$('tagsContainer'),sug=$('sug');
const mezclar=a=>[...a].sort(()=>0.5-Math.random());
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const words=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const lev=(a,b)=>{if(Math.abs(a.length-b.length)>1)return 9;const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]};
const hay=o=>norm([o.nombre,o.titulo,o.plan,o.keys,o.precio].join(' '));
/* una palabra coincide si está contenida o si se parece (tolera 1 error de tipeo) */
const tokOk=(h,hw,t)=>h.includes(t)||(t.length>=4&&hw.some(w=>w.length>=3&&lev(w,t)<=1));
const hexRGB=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');const n=parseInt(h,16);return h.length===6&&!isNaN(n)?[n>>16&255,n>>8&255,n&255].join(','):''};
const precioH=t=>{const m=String(t==null?'':t).match(/^(\D*?)\s*(\d.*)$/);return m&&m[1]?`<small>${E(m[1])}</small>${E(m[2])}`:E(t)};
const cPlan=(p,i)=>`<div class="plan-card"${hexRGB(p.acento)?` style="--pc:${hexRGB(p.acento)}"`:''}><div class="plan-head"><div class="plan-tx"><div class="plan-name">${E(p.nombre)}</div><div class="plan-price">${precioH(p.precio)}</div></div>${p.icono?`<img class="plan-img" width="104" height="104" src="${E(encodeURI(p.icono))}" alt="${E(p.nombre)}" loading="eager" decoding="async" onerror="this.remove()">`:''}</div><div class="plan-sep"></div><ul class="plan-list">${String(p.desc||'').split('\n').filter(t=>t.trim()).map(t=>`<li>${E(t)}</li>`).join('')}</ul><button class="btn-glow" data-plan="${i}">Seleccionar plan${PLANE}</button></div>`;

const cPor=p=>`<div class="bg-card gcard"${pcs(p)}>${pic(p)}<div class="label">${E(p.nombre)} <small>${E(p.plan)}</small></div></div>`;
const revObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add('in');if(t.classList.contains('carousel')){t.dataset.seen=1;t.querySelectorAll('.rv').forEach(k=>k.classList.add('in'))}revObs.unobserve(t)}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
function reveal(){document.querySelectorAll('.sec-head,.plan-card,.model-card,.bg-card,.pregunta-card,.cta>*').forEach((el,i)=>{if(el.dataset.rv)return;el.dataset.rv=1;el.classList.add('rv');const sib=[...el.parentNode.children].indexOf(el);el.style.setProperty('--d',Math.min(sib,6)*.09+'s');const car=el.closest('.carousel');if(car){if(car.dataset.seen)el.classList.add('in');else revObs.observe(car)}else revObs.observe(el)})}
const VM={};
['carouselModelos','carouselPorta'].forEach(id=>{const c=$(id);if(!c)return;c.classList.add('collapsed');const b=document.createElement('button');b.type='button';b.className='vermas none';c.insertAdjacentElement('afterend',b);VM[id]=b;
  b.onclick=()=>{const cerrando=!c.classList.toggle('collapsed');vmUpd(id,+b.dataset.t);if(!cerrando)c.closest('.section').scrollIntoView({behavior:'smooth'})}});
function vmUpd(id,n){const b=VM[id];if(!b)return;const c=$(id),extra=Math.max(0,n-3);b.dataset.n=extra;b.dataset.t=n;b.classList.toggle('none',extra===0);const abierto=!c.classList.contains('collapsed');b.classList.toggle('open',abierto);b.innerHTML=(abierto?'Ver menos ':'Ver más ('+extra+') ')+'<i></i>'}
function pintar(q,exacto){
  const nq=norm(q).trim(),todo=!nq||nq==='todos',toks=nq.split(/\s+/);
  const ok=o=>{if(todo)return true;if(exacto)return words([o.nombre,o.titulo,o.plan,o.keys].join(' ')).includes(nq);const h=hay(o),hw=words(h);return toks.every(t=>tokOk(h,hw,t))};
  const fill=(id,arr,fn,msg)=>{const ix=[];arr.forEach((o,i)=>{if(ok(o))ix.push(i)});const el=$(id),k=ix.join(',')||'-';if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=ix.map(i=>fn(arr[i],i)).join('')||`<p class="nores">${msg}</p>`}return ix.length};
  const a=fill('carouselPlanes',D.planes,cPlan,'No hay planes con esa palabra clave.');
  const b=fill('carouselModelos',D.modelos,cMod,'No hay modelos con esa palabra clave.');
  const c=fill('carouselPorta',D.portafolio,cPor,'No hay trabajos con esa palabra clave.');
  contador.textContent=b+' modelos';vmUpd('carouselModelos',b);vmUpd('carouselPorta',c);fixImgs();reveal();return{planes:a,modelos:b,portafolio:c};
}
/* Cada plan, modelo y trabajo del portafolio aporta palabras clave automáticamente */
const STOP=new Set('de del la el los las y e o con para en un una al por que plan planes modelo modelos web sitio pagina'.split(' '));
function pool(){
  const m=new Map(),add=t=>String(t||'').split(/[^\p{L}\p{N}]+/u).forEach(w=>{const n=norm(w);if(w.length<3||STOP.has(n)||/\d/.test(n)||m.has(n))return;m.set(n,w.charAt(0).toUpperCase()+w.slice(1))});
  D.planes.forEach(p=>add(p.nombre+' '+(p.keys||'')));
  D.modelos.forEach(x=>add(x.titulo+' '+(x.keys||'')));
  D.portafolio.forEach(x=>add(x.nombre+' '+x.plan+' '+(x.keys||'')));
  return [...m.values()];
}
const ENT=()=>[...D.planes.map(p=>({t:p.nombre,k:'Plan',sec:'planes',pr:p.precio,img:p.icono||p.img,x:p.keys})),...D.modelos.map(m=>({t:m.titulo,k:'Modelo',sec:'modelos',pr:m.precio,img:m.img,x:m.keys})),...D.portafolio.map(p=>({t:p.nombre,k:'Portafolio',sec:'portafolio',pr:p.plan,img:p.img,x:p.keys}))].filter(e=>e.t&&String(e.t).trim());
function predecir(q){
  const nq=norm(q).trim();if(!nq)return{list:[],cards:[]};
  const toks=nq.split(/\s+/),first=toks[0];
  const sc=e=>{const nt=norm(e.t),h=nt+' '+norm(e.x)+' '+norm(e.pr),hw=words(h);if(!toks.every(t=>tokOk(h,hw,t)))return -1;return nt.startsWith(nq)?0:words(e.t).some(x=>x.startsWith(first))?1:nt.includes(nq)?2:3};
  const seen=new Set(),ents=[];
  ENT().map(e=>({...e,s:sc(e)})).filter(e=>e.s>=0).sort((a,b)=>a.s-b.s).forEach(e=>{const k=norm(e.t)+e.k;if(!seen.has(k)){seen.add(k);ents.push(e)}});
  const terms=pool().filter(w=>{const n=norm(w);return n.startsWith(nq)&&!ents.some(e=>norm(e.t)===n)}).slice(0,3).map(w=>({t:w,k:'',term:1,s:.5}));
  return{list:[...terms,...ents].sort((a,b)=>a.s-b.s).slice(0,7),cards:ents.slice(0,4)};
}
const hl=(t,q)=>{const nt=norm(t),nq=norm(q).trim(),i=nt.indexOf(nq);if(!nq||i<0||nt.length!==t.length)return E(t);return E(t.slice(0,i))+'<mark>'+E(t.slice(i,i+nq.length))+'</mark>'+E(t.slice(i+nq.length))};
const ICO={Plan:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.500h18"/></svg>',Modelo:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',Portafolio:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></svg>',rec:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg>'};
const REC='joel_recientes',getRec=()=>{try{return JSON.parse(localStorage.getItem(REC)||'[]').filter(x=>typeof x==='string').slice(0,5)}catch(e){return[]}};
const addRec=t=>{try{localStorage.setItem(REC,JSON.stringify([t,...getRec().filter(x=>norm(x)!==norm(t))].slice(0,5)))}catch(e){}};
let sugL=[],sugI=-1;
const cerrarSug=()=>{sug.classList.remove('open');sugI=-1};
function abrirSug(list,q){
  sugL=list;sugI=-1;if(!list.length){cerrarSug();sug.innerHTML='';return}
  sug.innerHTML=list.map((e,i)=>`<div class="sg" role="option" data-i="${i}">${ICO[e.rec?'rec':e.k||'s']}<span class="st">${e.rec?E(e.t):hl(e.t,q)}</span>${e.k?`<small>${E(e.k)}${e.pr?' · '+E(e.pr):''}</small>`:''}<button class="fill" data-f="${i}" aria-label="Completar" tabindex="-1">↖</button></div>`).join('');
  sug.classList.add('open');
}
function irA(r,pref){const k=pref&&r[pref]>0?pref:['modelos','portafolio','planes'].find(x=>r[x]>0);if(k)$(k).scrollIntoView({behavior:'smooth'})}
function aplicar(t,exacto,sec){buscador.value=t;searchBox.classList.toggle('has-text',!!t);const r=pintar(t,exacto);if(t){addRec(t);irA(r,sec)}cerrarSug();buscador.blur();if(t)pintarCards(predecir(t).cards,t);else generarTags()}
function pintarCards(cards){
  if(!cards.length){generarTags();return}
  tagsContainer.className='scards';tagsContainer.innerHTML='';
  cards.forEach((e,i)=>{const b=document.createElement('button');b.type='button';b.className='scard';b.style.animationDelay=i*.06+'s';
    b.innerHTML=`<i${e.img?` style="background-image:url('${E(encodeURI(e.img))}')"`:''}>${e.img?'':E(String(e.t).charAt(0).toUpperCase())}</i><span><b>${E(e.t)}</b><small>${E(e.k)}${e.pr?' · '+E(e.pr):''}</small></span>`;
    b.onclick=()=>aplicar(e.t,false,e.sec);tagsContainer.appendChild(b)});
}
function generarTags(){
  tagsContainer.className='tags';tagsContainer.innerHTML='';
  const nom=[...D.modelos.map(m=>m.titulo),...D.portafolio.map(p=>p.nombre)].filter(Boolean).map(l=>({l,x:0})),kw=pool().map(l=>({l,x:1})),seen=new Set(),lista=[];
  mezclar([...mezclar(nom).slice(0,3),...mezclar(kw).slice(0,4)]).forEach(c=>{const n=norm(c.l);if(!seen.has(n)&&lista.length<6){seen.add(n);lista.push(c)}});
  lista.forEach(c=>{const s=document.createElement('span');s.className='tag';s.textContent='✦ '+c.l;s.onclick=()=>aplicar(c.l,!!c.x);tagsContainer.appendChild(s)});
}
function sugerir(){
  const q=buscador.value.trim();
  if(!q){abrirSug(document.activeElement===buscador?getRec().map(t=>({t,k:'',rec:1})):[],'');if(tagsContainer.className!=='tags')generarTags();return}
  const r=predecir(q);abrirSug(r.list,q);pintarCards(r.cards);

generarTags();pintar('');
let tmr;buscador.addEventListener('input',()=>{const q=buscador.value.trim();searchBox.classList.toggle('has-text',!!q);sugerir();clearTimeout(tmr);tmr=setTimeout(()=>pintar(q,false),140)});

/* Carruseles: flechas en PC y, en celulares, un plan por segundo (al llegar al final regresa al inicio). Animación propia con rAF: fluida y sin pelear con scroll-snap */
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,touch=matchMedia('(pointer:coarse)').matches;
  const gapOf=el=>parseFloat(getComputedStyle(el).columnGap)||14;
  const cardW=el=>{const k=el.children[0];return k?k.offsetWidth+gapOf(el):0};
  const ease=t=>.5-Math.cos(Math.PI*t)/2;
  function slide(el,to,ms){
    cancelAnimationFrame(el._raf);
    const from=el.scrollLeft,dist=to-from;
    if(Math.abs(dist)<1||reduce){el.scrollLeft=to;return}
    el.classList.add('moving');
    const t0=performance.now();
    const step=t=>{const k=Math.min(1,Math.max(0,(t-t0)/ms));el.scrollLeft=from+dist*ease(k);if(k<1)el._raf=requestAnimationFrame(step);else el.classList.remove('moving')};
    el._raf=requestAnimationFrame(step);
  }
  const cp=$('carouselPlanes'),head=cp&&cp.parentNode.querySelector('.sec-head');
  if(cp&&head){const ar=document.createElement('div');ar.className='car-arrows';ar.innerHTML='<button type="button" aria-label="Anterior">‹</button><button type="button" aria-label="Siguiente">›</button>';head.appendChild(ar);
    const [a,b]=ar.children,mover=d=>{const w=cardW(cp);if(!w)return;const max=cp.scrollWidth-cp.clientWidth,i=Math.round(cp.scrollLeft/w);slide(cp,Math.max(0,Math.min(max,(i+d)*w)),520)};
    a.onclick=()=>mover(-1);b.onclick=()=>mover(1);
    const chk=()=>ar.classList.toggle('off',cp.scrollWidth<=cp.clientWidth+4);chk();addEventListener('resize',chk);addEventListener('load',chk);new MutationObserver(chk).observe(cp,{childList:true})}
  if(reduce||!touch||!cp)return;
  let pausa=false,vis=false,fin=false,idle;
  cp.classList.add('auto');
  const parar=()=>{pausa=true;fin=false;clearTimeout(idle);cancelAnimationFrame(cp._raf);cp.classList.remove('moving','auto')},
        seguir=()=>{clearTimeout(idle);idle=setTimeout(()=>{pausa=false;cp.classList.add('auto')},6000)};
  cp.addEventListener('touchstart',parar,{passive:true});cp.addEventListener('touchend',seguir,{passive:true});cp.addEventListener('touchcancel',seguir,{passive:true});
  new IntersectionObserver(es=>{vis=es[0].isIntersecting},{threshold:.35}).observe(cp);
  (function tick(){
    setTimeout(()=>{
      if(!pausa&&vis&&!document.hidden){
        const max=cp.scrollWidth-cp.clientWidth,w=cardW(cp);
        if(max>4&&w){
          if(fin||cp.scrollLeft>=max-4){fin=false;slide(cp,0,800)}
          else{const nx=(Math.round(cp.scrollLeft/w)+1)*w;if(nx>=max-4){fin=true;slide(cp,max,600)}else slide(cp,nx,600)}
        }
      }
      tick();
    },1000);
  })();
})();
buscador.addEventListener('keydown',e=>{
  const n=sugL.length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!n)return;e.preventDefault();sugI=(sugI+(e.key==='ArrowDown'?1:-1)+n+1)%(n+1);if(sugI===n)sugI=-1;[...sug.children].forEach((c,i)=>c.classList.toggle('on',i===sugI));if(sugI>=0)sug.children[sugI].scrollIntoView({block:'nearest'});return}
  if(e.key==='Enter'){e.preventDefault();const s=sugL[sugI];if(s)aplicar(s.t,!!s.term,s.sec);else aplicar(buscador.value.trim(),false)}
  if(e.key==='Escape')cerrarSug();
});

/* Progreso, velo del video y menú activo */
const pg=$('prog');
const secs=D.menu.map(m=>$(m.id)).filter(Boolean),links=[...document.querySelectorAll('#navWrap a.link')],dl=[...document.querySelectorAll('#drawer a[href^="#"]')];
let tops=[],cur0=null,tick=false;
let heroH=innerHeight,parado=false,mx=0,vo=-1;const veil=$('veil'),vid=$('videoFondo');
const medir=()=>{heroH=$('inicio').offsetHeight||innerHeight;mx=document.documentElement.scrollHeight-innerHeight;tops=secs.map(s=>[s.id,s.offsetTop])};
function onScroll(){
  const y=scrollY;
  pg.style.transform='scaleX('+(mx>0?y/mx:0)+')';
  const lejos=y>heroH*.85;if(lejos!==parado){parado=lejos;if(lejos)vid.pause();else vid.play().catch(()=>{})} /* abajo: video en pausa y desenfocado (ahorra batería); arriba: se reanuda */
  {const o=+Math.max(0,Math.min(1,(y-heroH*.3)/(heroH*.5))).toFixed(2);if(o!==vo){vo=o;veil.style.opacity=o}} /* el video se desenfoca al pasar del inicio */
  let cur=tops[0]&&tops[0][0];for(const t of tops)if(y+200>=t[1])cur=t[0];
  if(cur===cur0)return;cur0=cur;
  dl.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+cur));
  links.forEach(l=>{const on=l.getAttribute('href')==='#'+cur;if(on){const nw=$('navWrap'),r=l.getBoundingClientRect(),nr=nw.getBoundingClientRect();nw.scrollTo({left:nw.scrollLeft+r.left-nr.left-8,behavior:'smooth'})}l.classList.toggle('active',on)});
}

addEventListener('resize',()=>{medir();onScroll()});addEventListener('load',()=>{medir();onScroll()});if(window.ResizeObserver)new ResizeObserver(()=>{medir();onScroll()}).observe($('app'));
