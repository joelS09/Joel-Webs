<style>
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.nav-solid{background:rgba(0,0,0,.35) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{font-weight:900;font-size:18px;flex-shrink:0;text-shadow:0 2px 20px rgba(0,0,0,.9)}
nav{position:fixed;top:0;left:0;right:0;height:58px;background:transparent;transition:background .4s;z-index:100;display:flex;align-items:center;padding:0 12px 0 16px;gap:8px;justify-content:space-between}
.pill{flex-shrink:0;color:#fff;padding:9px 15px;border-radius:99px;font-weight:800;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.6);text-decoration:none;white-space:nowrap;margin-left:auto}
.hero{position:relative;z-index:0;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px 40px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.5));z-index:-1}
.hero h1{font-size:clamp(32px,8vw,72px);font-weight:800;letter-spacing:-2px;line-height:.95;max-width:700px;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero p{opacity:.92;max-width:520px;margin:14px 0 22px;font-size:14px;text-shadow:0 1px 12px #000}
.search{background:rgba(16,16,16,.85);border:1px solid #333;border-radius:99px;padding:12px 16px;display:flex;align-items:center;gap:12px;width:100%;max-width:480px;margin-top:18px}
.search input{background:transparent;border:0;color:#fff;flex:1;outline:none;font-size:14px}
.clear-btn{width:22px;height:22px;border-radius:50%;background:#fff;color:#000;border:0;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:900;cursor:pointer}
.search.has-text .clear-btn{display:flex}
.tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.tag{background:rgba(17,17,17,.85);border:1px solid #2a2a2a;border-radius:99px;padding:6px 12px;font-size:11px;opacity:.85;cursor:pointer}
.section{padding:32px 0 10px 16px;max-width:1280px;margin:0 auto;scroll-margin-top:70px}
.sec-head{margin-bottom:12px;padding-right:16px;display:flex;justify-content:space-between}
.sec-head h2{font-size:19px;font-weight:700}.sec-head h2:before{content:"✦ "}
.carousel{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 26px 14px;margin-left:-14px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card,.model-card{flex:0 0 78vw;max-width:300px;background:#0f0f0f;border-radius:16px;display:flex;flex-direction:column}
.nores{opacity:.6;padding:20px 0;font-size:14px}
.pic{display:block;width:100%;height:auto;flex:1 0 auto;object-fit:cover;border-radius:16px 16px 0 0}
.pic.empty{height:170px;background:#000}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.led{position:relative}
.led::before,.led::after{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:conic-gradient(from var(--a),var(--ledc,#fff,#fff));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.led::after{filter:blur(7px);padding:4px;opacity:.9}
.led-rgb .led::before,.led-rgb .led::after{animation:spin var(--ledt,4s) linear infinite}
.card-info{padding:12px 14px 6px;display:flex;justify-content:space-between;font-size:12px}
.card-info span{font-weight:700}
.card-desc{padding:0 14px 12px;opacity:.6;font-size:11.5px;line-height:1.5;min-height:54px;white-space:pre-line}
.card button,.model-card button{margin:auto 12px 12px;background:#fff;color:#000;border:0;padding:9px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer}
.bg-card{flex:0 0 78vw;max-width:320px;border-radius:16px;background:#0f0f0f;display:flex;flex-direction:column}
.bg-card .pic{border-radius:16px 16px 0 0}
.bg-card .pic.empty{height:200px}
.bg-card .label{padding:12px 14px;font-size:16px;font-weight:700}
.bg-card .label small{display:block;font-size:11px;opacity:.7}
.preguntas-grid{display:flex;flex-direction:column;gap:12px;padding-right:16px;padding-bottom:20px}
.pregunta-card{background:#111;border:1px solid #1e1e1e;border-radius:18px;padding:0 20px;overflow:hidden}
.pregunta-card h3{font-size:16px;font-weight:700;padding:20px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pregunta-card h3::after{content:"▼";font-size:18px;transform:scaleX(1.4)}
.pregunta-card.open h3::after{transform:scaleX(1.4) rotate(180deg)}
.pregunta-card p{font-size:14px;line-height:1.5;max-height:0;overflow:hidden;opacity:0;transition:.4s}
.pregunta-card.open p{max-height:300px;opacity:.7;margin-bottom:20px}
.cta{border-top:1px solid rgba(255,255,255,.08);padding:44px 20px;text-align:center}
.cta h2{white-space:pre-line}
#btnCotizar{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:99px;background:#fff;color:#000;font-weight:700;text-decoration:none}
.footer{padding:22px 16px;text-align:center;font-size:12px;line-height:1.8;opacity:.75;border-top:1px solid rgba(255,255,255,.08);text-shadow:0 1px 8px #000}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;z-index:120}
#pre{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;transition:.8s}
#pre.out{opacity:0;visibility:hidden}
#pre .pre-logo{width:90px;height:90px;object-fit:contain;margin:0 auto 14px;display:block}
#pre .pt{font-size:clamp(2.4rem,9vw,4.4rem);font-weight:700;text-align:center}
#pre .pl2{display:flex;align-items:center;gap:14px;margin:18px auto 0;width:min(260px,70vw)}
#pre .pb{flex:1;height:1px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
#pre .pb:after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(var(--p,0));transform-origin:left}
#pre small{font-size:.7rem;letter-spacing:.2em;min-width:34px;text-align:right}

/* ===== Liquid glass ===== */
:root{--ins:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(255,255,255,.22),inset 1px 0 2px rgba(255,255,255,.18),inset -1px 0 2px rgba(255,255,255,.12)}
.glass,.search,.tag,.card,.model-card,.bg-card{
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 42%,rgba(8,10,20,.55)),radial-gradient(120% 90% at 12% 130%,rgba(0,150,255,.62),transparent 60%),radial-gradient(110% 90% at 92% 135%,rgba(255,0,170,.55),transparent 58%),radial-gradient(90% 70% at 55% 140%,rgba(255,160,0,.38),transparent 60%);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:var(--ins),0 10px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16)}
.card,.model-card,.bg-card{background-color:rgba(12,14,22,.8)}
.search{background-color:rgba(12,14,22,.55)}
.tag{opacity:1;box-shadow:var(--ins),0 6px 16px rgba(0,0,0,.4)}
.card .pic,.model-card .pic,.bg-card .pic{margin:-1px -1px 0;width:calc(100% + 2px)}
/* ===== Barra inferior ===== */
@property --x{syntax:'<length>';initial-value:0px;inherits:true}
.dock{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(520px,calc(100% - 24px));height:66px;z-index:110;display:flex;align-items:center;padding:0 8px 0 10px;gap:4px;transition:--x .6s cubic-bezier(.34,1.35,.5,1)}
.dock::before{content:"";position:absolute;inset:8px 12px -8px;border-radius:34px;background:rgba(0,0,0,.6);filter:blur(16px);z-index:-2}
.dock-bg{position:absolute;inset:0;border-radius:34px;z-index:-1;box-shadow:var(--ins);-webkit-mask:radial-gradient(circle 34px at var(--x) -6px,transparent 33px,#000 34.5px);mask:radial-gradient(circle 34px at var(--x) -6px,transparent 33px,#000 34.5px)}
.dock-logo{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:900;text-decoration:none}
.dock-logo img{width:100%;height:100%;object-fit:cover;display:block}
.tabs{flex:1;display:flex;min-width:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:10px;color:rgba(255,255,255,.62);text-decoration:none;-webkit-tap-highlight-color:transparent;transition:color .3s}
.tab svg{transition:opacity .25s,transform .4s}
.tab .t{font-size:10px;font-weight:600;text-transform:lowercase;white-space:nowrap}
.tab .t::first-letter{text-transform:uppercase}
.tab.on{color:#fff}.tab.on svg{opacity:0;transform:translateY(8px)}.tab.on .t{font-weight:800}
.bubble{position:absolute;left:calc(var(--x) - 27px);top:-33px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#10131f;background:radial-gradient(circle at 30% 22%,#fff,#e4ebff 58%,#b8c8ff);box-shadow:0 0 0 3px rgba(255,255,255,.22),0 8px 22px rgba(80,120,255,.6),inset 0 -4px 8px rgba(80,120,255,.35);pointer-events:none}
.bubble.go{animation:squish .6s}
.bubble span{display:grid;animation:pop .5s}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.3,.76)}62%{transform:scale(.9,1.14)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.4) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.footer{padding-bottom:120px}
</style>
</head>
<body>
<div id="pre"><div><img id="preLogo" class="pre-logo" alt=""><div class="pt" id="preName"></div><div class="pl2"><span class="pb"></span><small id="pn">0%</small></div></div></div>
<div id="prog"></div>
<video class="bgv" id="videoFondo" autoplay muted loop playsinline preload="auto"></video>
<nav><span class="logo" id="logo"></span><a href="#cotizar" class="pill glass" id="pill"></a></nav>
<main id="app"></main>
<footer class="footer" id="footer"></footer>
<div class="dock" id="dock"><div class="dock-bg glass"></div><a class="dock-logo glass" id="dockLogo" href="#inicio" aria-label="Inicio"></a><div class="tabs" id="tabs"></div><div class="bubble" id="bubble"><span id="bIcon"></span></div></div>

<script src="content/data.js"></script>
<script>
/* El contenido vive en content/data.js — edítalo desde admin.html */
const D=(()=>{try{if(/preview/.test(location.search)){const d=localStorage.getItem('joelwebs_draft');if(d)return JSON.parse(d)}}catch(e){}return window.SITE_DATA})();
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pic=o=>o.img?`<img class="pic" src="${E(encodeURI(o.img))}" alt="">`:'<div class="pic empty"></div>';
const fixImgs=()=>document.querySelectorAll('img.pic').forEach(im=>{im.onerror=()=>im.replaceWith(Object.assign(document.createElement('div'),{className:'pic empty'}))});
const fill=(t,n,p)=>String(t).replace('{n}',n).replace('{p}',p);
const M=D.marca,C=D.contacto,S=D.secciones;
const ST=Object.assign({ledModo:'fijo',ledColor:'#ffffff',rgbColores:['#ff0055','#00ff88','#0055ff'],ledVelocidad:'4'},D.estilo||{});
(()=>{const rgb=ST.ledModo==='rgb'&&ST.rgbColores.length>1,c=rgb?[...ST.rgbColores,ST.rgbColores[0]]:[ST.ledColor,ST.ledColor],r=document.documentElement.style;
r.setProperty('--ledc',c.join(','));r.setProperty('--ledt',(parseFloat(ST.ledVelocidad)||4)+'s');if(rgb)document.body.classList.add('led-rgb')})();
const wa=m=>`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(m)}`;

$('logo').textContent=M.nombre;$('preName').textContent=M.nombre;
$('preLogo').src=M.logo;$('preLogo').onerror=function(){this.onerror=null;this.src=M.logo.replace(/\.jpg$/,'.png')};
const ICONS={inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',planes:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',modelos:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',portafolio:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/>',preguntas:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.8.6-1.5 1-1.5 2M12 17h.01"/>',_:'<circle cx="12" cy="12" r="3"/>'};
const svg=id=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||ICONS._}</svg>`;
$('tabs').innerHTML=D.menu.map(m=>`<a class="tab" href="#${E(m.id)}" data-id="${E(m.id)}">${svg(m.id)}<span class="t">${E(m.texto)}</span></a>`).join('');
$('dockLogo').innerHTML=`<img src="${E(encodeURI(M.logo))}" alt="">`;
$('dockLogo').firstChild.onerror=function(){$('dockLogo').textContent=M.nombre.charAt(0)};
$('pill').textContent=D.boton.texto;
$('footer').innerHTML=D.footer.map(l=>`<div>${E(l)}</div>`).join('');

$('app').innerHTML=`
<div class="hero" id="inicio"><h1>${E(D.hero.titulo)}</h1><p>${E(D.hero.texto)}</p>
<div class="search" id="searchBox"><input id="buscador" placeholder="${E(D.hero.placeholder)}" autocomplete="off"><button class="clear-btn" id="clearBtn">✕</button></div>
<div class="tags" id="tagsContainer"></div></div>
<div class="section" id="planes"><div class="sec-head"><h2>${E(S.planes)}</h2></div><div class="carousel" id="carouselPlanes"></div></div>
<div class="section" id="modelos"><div class="sec-head"><h2>${E(S.modelos)}</h2><span id="contador"></span></div><div class="carousel" id="carouselModelos"></div></div>
<div class="section" id="portafolio"><div class="sec-head"><h2>${E(S.portafolio)}</h2></div><div class="carousel" id="carouselPorta"></div></div>
<div class="section" id="preguntas"><div class="sec-head"><h2>${E(S.preguntas)}</h2></div><div class="preguntas-grid">${D.preguntas.map(q=>`<div class="pregunta-card"><h3>${E(q.q)}</h3><p>${E(q.a)}</p></div>`).join('')}</div></div>
<div class="cta" id="cotizar"><h2 id="tituloCotizar">${E(C.titulo)}</h2><a id="btnCotizar" href="${wa(C.msgGeneral)}">${E(C.boton)}</a></div>`;

$('inicio').prepend($('videoFondo'));fixImgs();
/* Buscador: filtra planes, modelos y portafolio; sugerencias automáticas */
const buscador=$('buscador'),contador=$('contador'),searchBox=$('searchBox'),clearBtn=$('clearBtn'),tagsContainer=$('tagsContainer');
const mezclar=a=>[...a].sort(()=>0.5-Math.random());
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const words=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const cPlan=(p,i)=>`<div class="card led">${pic(p)}<div class="card-info"><b>${E(p.nombre)}</b><span>${E(p.precio)}</span></div><div class="card-desc">${E(p.desc)}</div><button data-plan="${i}">Seleccionar plan</button></div>`;
const cMod=(m,i)=>`<div class="model-card led">${pic(m)}<div class="card-info"><b>${E(m.titulo)}</b><span>${E(m.precio)}</span></div><button data-mod="${i}">Seleccionar modelo</button></div>`;
const cPor=p=>`<div class="bg-card led">${pic(p)}<div class="label">${E(p.nombre)} <small>${E(p.plan)}</small></div></div>`;
function pintar(q,exacto){
  const nq=norm(q).trim(),todo=!nq||nq==='todos';
  const ok=o=>todo||(exacto?words([o.nombre,o.titulo,o.plan,o.keys].join(' ')).includes(nq):norm([o.nombre,o.titulo,o.plan,o.keys,o.precio].join(' ')).includes(nq));
  const fill=(id,arr,fn,msg)=>{const h=arr.map((o,i)=>ok(o)?fn(o,i):'').join('');$(id).innerHTML=h||`<p class="nores">${msg}</p>`;return arr.filter(ok).length};
  fill('carouselPlanes',D.planes,cPlan,'No hay planes con esa palabra clave.');
  contador.textContent=fill('carouselModelos',D.modelos,cMod,'No hay modelos con esa palabra clave.')+' modelos';
  fill('carouselPorta',D.portafolio,cPor,'No hay trabajos con esa palabra clave.');
  fixImgs();
}
/* Cada plan, modelo y trabajo del portafolio aporta palabras clave automáticamente */
const STOP=new Set('de del la el los las y e o con para en un una al por que plan planes modelo modelos web sitio pagina'.split(' '));
function pool(){
  const m=new Map(),add=t=>String(t||'').split(/[^\p{L}\p{N}]+/u).forEach(w=>{const n=norm(w);if(w.length<3||STOP.has(n)||/\d/.test(n)||m.has(n))return;m.set(n,w.charAt(0).toUpperCase()+w.slice(1))});
  D.planes.forEach(p=>add(p.nombre+' '+(p.keys||'')));
  D.modelos.forEach(x=>add(x.titulo+' '+(x.keys||'')));
  D.portafolio.forEach(x=>add(x.nombre+' '+x.plan+' '+(x.keys||'')));
  return [...m.values()];
}
function generarTags(){
  tagsContainer.innerHTML='';
  ['Todos',...mezclar(pool()).slice(0,4)].forEach(p=>{
    const s=document.createElement('span');s.className='tag';s.textContent='✦ '+p;
    s.onclick=()=>{const w=p==='Todos'?'':p;buscador.value=w;searchBox.classList.toggle('has-text',!!w);pintar(w,true);if(w)$('modelos').scrollIntoView({behavior:'smooth'})};
    tagsContainer.appendChild(s);
  });
}
generarTags();pintar('');
buscador.addEventListener('input',()=>{const q=buscador.value.trim();searchBox.classList.toggle('has-text',!!q);if(!q)generarTags();pintar(q,false)});
clearBtn.addEventListener('click',()=>{buscador.value='';searchBox.classList.remove('has-text');pintar('');generarTags()});

/* Selección → WhatsApp */
function elegir(titulo,msg,n,p){const u=wa(fill(msg,n,p));$('tituloCotizar').textContent=fill(titulo,n,p);$('btnCotizar').href=u;$('cotizar').scrollIntoView({behavior:'smooth'});setTimeout(()=>window.open(u,'_blank'),600)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-plan],button[data-mod]');
  if(b){if(b.dataset.plan!=null){const p=D.planes[b.dataset.plan];elegir(C.tituloPlan,C.msgPlan,p.nombre,p.precio)}else{const m=D.modelos[b.dataset.mod];elegir(C.tituloModelo,C.msgModelo,m.titulo,m.precio)}return}
  const q=e.target.closest('.pregunta-card');if(q)q.classList.toggle('open');
});

/* Progreso, velo del video y menú activo */
const pg=$('prog');
const nav=document.querySelector('nav'),pl=document.querySelector('.hero h1');
const secs=D.menu.map(m=>$(m.id)).filter(Boolean);
const dock=$('dock'),tabEls=[...document.querySelectorAll('.tab')];let act=null;
function place(){const t=tabEls.find(x=>x.dataset.id===act);if(!t)return;const d=dock.getBoundingClientRect(),r=t.getBoundingClientRect();dock.style.setProperty('--x',(r.left-d.left+r.width/2)+'px')}
function setActive(id){if(!id||id===act)return;act=id;tabEls.forEach(t=>t.classList.toggle('on',t.dataset.id===id));$('bIcon').innerHTML=svg(id);const b=$('bubble');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');place()}
addEventListener('resize',place);addEventListener('load',place);
function onScroll(){
  const y=scrollY,mx=document.documentElement.scrollHeight-innerHeight;
  pg.style.transform='scaleX('+(mx>0?y/mx:0)+')';
  nav.classList.toggle('nav-solid',pl.getBoundingClientRect().top<=58);
  let cur=secs[0]&&secs[0].id;secs.forEach(s=>{if(y+200>=s.offsetTop)cur=s.id});
  setActive(cur);
}
addEventListener('scroll',onScroll,{passive:true});onScroll();setTimeout(place,300);

/* Precarga */
const pre=$('pre'),pn=$('pn');
function done(){pre.classList.add('out');setTimeout(()=>pre.remove(),800)}
const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,2);pre.style.setProperty('--p',e);pn.textContent=Math.round(e*100)+'%';if(k<1)requestAnimationFrame(f);else setTimeout(done,200)})(t0);setTimeout(done,2500);

/* Video de fondo (continúa en el mismo segundo al volver) */
const v=$('videoFondo');v.muted=true;v.loop=true;v.playsInline=true;v.src=M.video;
const guardar=()=>{try{if(v.currentTime>0.5)sessionStorage.setItem('joel_video_segundo',v.currentTime)}catch(e){}};
function iniciar(){const g=parseFloat(sessionStorage.getItem('joel_video_segundo')||0);try{if(g>0.5&&v.duration&&g<v.duration-0.5)v.currentTime=g}catch(e){}const p=v.play();if(p)p.catch(()=>{})}
v.addEventListener('loadedmetadata',iniciar);
v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime>v.duration-0.25){v.currentTime=0;v.play().catch(()=>{})}guardar()});
v.addEventListener('pause',()=>{if(!document.hidden)v.play().catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)iniciar()});
['pageshow','focus'].forEach(e=>addEventListener(e,iniciar));['pagehide','blur'].forEach(e=>addEventListener(e,guardar));
setInterval(guardar,800);
</script>
</body>
